    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "Sigmentum",
          "applicationCategory": "FinanceApplication",
          "operatingSystem": "Web",
          "description": "AI-powered automated trading signal platform with real-time alerts, Hindsight Sandbox backtesting, and auto-execution agents for gold, crypto, forex, and equities.",
          "offers": [
            { "@type": "Offer", "name": "Free",     "price": "0",  "priceCurrency": "USD" },
            { "@type": "Offer", "name": "Signal",   "price": "28", "priceCurrency": "USD" },
            { "@type": "Offer", "name": "Momentum", "price": "82", "priceCurrency": "USD" }
          ],
          "featureList": [
            "AI-generated trading signals",
            "Automated execution agent",
            "Hindsight Sandbox backtesting",
            "Paper trading simulation",
            "Telegram and email alerts",
            "Copy-agent marketplace"
          ],
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is the Hindsight Sandbox?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The Hindsight Sandbox lets you backtest any trading strategy against up to 2 years of real historical price data. Select an asset and rule, run the backtest, and see win rate, net P&L, max drawdown, and monthly returns — for free, before risking any capital."
              }
            },
            {
              "@type": "Question",
              "name": "How does the Execution Agent work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The Execution Agent monitors markets in real-time using your configured rules. When a trigger condition is met (e.g. 85% AI confidence), it sends an alert via Telegram, email, or SMS — or executes the trade automatically via your connected broker API on Momentum tier."
              }
            },
            {
              "@type": "Question",
              "name": "Is Sigmentum free to use?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. The Free tier includes 5 signals per day, a $10,000 simulated paper trading wallet, and 3 Hindsight Sandbox backtests per month — no credit card required."
              }
            },
            {
              "@type": "Question",
              "name": "What assets does Sigmentum cover?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sigmentum covers gold (XAU/USD), major forex pairs (EUR/USD, GBP/USD, USD/JPY), cryptocurrency (BTC/USD, ETH/USD), and US equities (SPY, TSLA, AAPL) with more assets being added."
              }
            }
          ]
        }
      ]
    }
    </script>
