name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/help-with-build-ujSHT]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-astro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install Astro dependencies
        run: npm ci
        working-directory: astro

      - name: Build Astro
        run: npm run build
        working-directory: astro

      - name: Assert sitemap exists
        run: test -f astro/dist/sitemap-index.xml

      - name: Assert HTML page count (≥32)
        run: |
          COUNT=$(find astro/dist -name "*.html" | wc -l)
          echo "HTML pages: $COUNT"
          [ "$COUNT" -ge 32 ]

      - name: Assert sitemap URL count (≥32)
        run: |
          COUNT=$(grep -o "<loc>" astro/dist/sitemap-0.xml | wc -l)
          echo "Sitemap URLs: $COUNT"
          [ "$COUNT" -ge 32 ]

      - name: Fail if sigmentum.com in Astro dist
        run: |
          if grep -r "sigmentum\.com" astro/dist/ 2>/dev/null; then
            echo "ERROR: sigmentum.com found in astro/dist — domain must be set via PUBLIC_SITE_URL"
            exit 1
          fi
          echo "OK: no sigmentum.com in astro/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: astro-dist
          path: astro/dist

  build-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install React dependencies
        run: npm ci
        working-directory: frontend

      - name: Build React SPA
        run: npm run build
        working-directory: frontend

      - name: Fail if sigmentum.com in React dist
        run: |
          if grep -r "sigmentum\.com" frontend/dist/ 2>/dev/null; then
            echo "ERROR: sigmentum.com found in frontend/dist"
            exit 1
          fi
          echo "OK: no sigmentum.com in frontend/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: frontend/dist

  combine:
    needs: [build-astro, build-react]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: astro-dist
          path: _site

      - uses: actions/download-artifact@v4
        with:
          name: react-dist
          path: _site/app

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: combine
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
